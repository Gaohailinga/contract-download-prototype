<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>签署完成 - PC 端（评审版）</title>
<style>
/* ===== 原图 1:1 还原，与纯净版一致（截图 2210×1276@2x，尺寸取 1/2 → 1105×638） ===== */
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
body{background:#dfe3e8;display:flex;flex-direction:column;align-items:center;
     padding:92px 24px 48px;min-height:100vh;
     font-family:-apple-system,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif}
.page{width:1105px;height:638px;background:#f5f7fa;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.18);
      flex:0 0 auto;position:relative}

/* 顶部栏 截图 y0-78，白底，底边 #e5e7eb */
.topbar{height:39px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;padding-left:21px}
.mark{width:22px;height:22px;border-radius:5px;background:#1777ff;color:#fff;font-size:13px;font-weight:600;
      display:flex;align-items:center;justify-content:center;margin-right:9px}
.brand{font-size:15px;font-weight:600;color:#1f2937;letter-spacing:.3px}

/* 页面标题 截图 y142-174，蓝点 #1777ff + 文字 #1f2937 */
.crumb{margin:32px 0 0 194px;font-size:15px;color:#1f2937;display:flex;align-items:center;gap:7px}
.crumb i{width:6px;height:6px;border-radius:50%;background:#1777ff;display:block}

/* 内容卡片 截图 x357-1867 / y199-1258 → 178.5 起，宽 755，高 529.5 */
.card{margin:12px 0 0 178px;width:755px;height:530px;background:#fff;border-radius:2px;
      display:flex;flex-direction:column;align-items:center;text-align:center}

/* 成功图标 直径 108→54，绿 #53c31b */
.icon{width:54px;height:54px;border-radius:50%;background:#53c31b;display:flex;align-items:center;
      justify-content:center;margin-top:87px}
.icon svg{width:29px;height:29px}

/* 主标题 截图 y533-574，20px #262626 */
.title{margin-top:25px;font-size:20px;font-weight:500;color:#262626;line-height:1.1}

/* 说明 截图 y607-636，14px #a3a3a3 */
.desc{margin-top:16px;font-size:14px;color:#a3a3a3;line-height:1.25}

/* 按钮组 截图 y675-721，高 47→23.5 */
.btns{margin-top:20px;display:flex;gap:12px;align-items:center}

/* 原有按钮「知道了」 白底 + 蓝边 + 蓝字 */
.know{height:24px;padding:0 12px;border:1px solid #1990ff;border-radius:2px;background:#fff;
      color:#1990ff;font-size:12px;font-family:inherit;cursor:pointer;transition:background .15s}
.know:hover{background:#f0f7ff}

/* ===== 新增元素：下载合同按钮（原图无） ===== */
.dl{height:24px;padding:0 14px;border:1px solid #1990ff;border-radius:2px;background:#1990ff;
    color:#fff;font-size:12px;font-family:inherit;cursor:pointer;transition:background .15s}
.dl:hover{background:#0d7ae0;border-color:#0d7ae0}

/* 页面正中提示：成功 / 失败反馈（演示用，置于页面中央） */
.tip{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.94);
     display:flex;flex-direction:column;align-items:center;gap:10px;min-width:130px;
     padding:22px 26px;border-radius:8px;background:rgba(0,0,0,.78);color:#fff;
     font-size:14px;line-height:1.4;text-align:center;opacity:0;pointer-events:none;
     transition:opacity .22s,transform .22s;z-index:20}
.tip.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.tip i{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
       font-style:normal;font-size:20px;font-weight:700;color:#fff}
.tip.ok i{background:#53c31b}
.tip.err i{background:#ff4d4f}

/* 按钮禁用态 */
.dl:disabled{opacity:.7;cursor:default}

/* ===== 评审层：仅评审版存在，不参与开发交付 ===== */
.ctl{position:fixed;left:50%;top:22px;transform:translateX(-50%);z-index:30;display:flex;
     align-items:center;gap:12px;background:rgba(255,255,255,.97);border:1px solid #e2e8f0;
     border-radius:999px;padding:8px 14px;box-shadow:0 8px 24px rgba(15,23,42,.14);
     font-size:13px;color:#475569;white-space:nowrap}
.ctl>em{font-style:normal;font-weight:600;color:#0f172a}
.seg{display:flex;background:#f1f5f9;border-radius:999px;padding:3px}
.seg button{border:0;background:none;font-family:inherit;font-size:13px;color:#64748b;
            padding:6px 16px;border-radius:999px;cursor:pointer;transition:.15s}
.seg button.on{background:#fff;color:#0f172a;font-weight:600;box-shadow:0 1px 4px rgba(15,23,42,.14)}
.notes{width:1105px;display:flex;gap:16px;margin-top:26px}
.note{flex:1;background:#fff;border-radius:8px;padding:14px 16px;box-shadow:0 4px 16px rgba(15,23,42,.08);
      border-left:3px solid #cbd5e1;font-size:13px;color:#475569;line-height:1.75}
.note h5{font-size:12px;font-weight:600;color:#334155;margin-bottom:5px}
.note.key{border-left-color:#1890ff}
.note.key h5{color:#1890ff}
.note code{background:#eef2f7;border-radius:3px;padding:1px 5px;font-size:12px;color:#0f172a}
</style>
</head>
<body>

<!-- 评审控制条：切换下载成功页 / 下载失败页 -->
<div class="ctl">
  <em>下载结果</em>
  <div class="seg" id="seg">
    <button type="button" data-scene="ok" class="on">下载成功页</button>
    <button type="button" data-scene="fail">下载失败页</button>
  </div>
</div>

<div class="page">

  <div class="topbar">
    <span class="mark">签</span>
    <span class="brand">电子签约平台</span>
  </div>

  <div class="crumb"><i></i>签署完成</div>

  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 12.5 L9.5 18 L20 6.5" />
      </svg>
    </div>
    <div class="title">签署成功</div>
    <div class="desc">恭喜您，签约已完成</div>
    <div class="btns">
      <button class="dl" type="button" id="dl">下载合同</button>
      <button class="know" type="button" id="know">知道了</button>
    </div>
  </div>

  <!-- 页面正中提示：仅评审版用于演示下载结果 -->
  <div class="tip" id="tip"><i id="tip-ico"></i><span id="tip-txt"></span></div>

</div>

<!-- 评审标注 -->
<div class="notes">
  <div class="note key">
    <h5>新增元素 · 下载合同按钮</h5>
    置于「知道了」左侧，同为小尺寸按钮。除该按钮外，页面<strong>未改动任何原有元素</strong>。
  </div>
  <div class="note">
    <h5>无页面跳转</h5>
    本需求<strong>不新增页面</strong>，下载全程在当前页完成，无页面跳转。
  </div>
  <div class="note">
    <h5>下载内容</h5>
    页面<strong>不展示合同文件信息</strong>；多份合同由上游<strong>打包为 zip</strong> 返回地址，一次下载，前端不参与打包。
  </div>
  <div class="note">
    <h5>交互与反馈</h5>
    点击后按钮进 <code>loading</code> 防重复提交；成功为浏览器原生下载，失败以提示承载。本评审版的成功／失败提示<strong>居中展示</strong>，仅用于演示。
  </div>
</div>

<script>
  var dl = document.getElementById('dl');
  var tip = document.getElementById('tip');
  var tipIco = document.getElementById('tip-ico');
  var tipTxt = document.getElementById('tip-txt');
  var scene = 'ok';

  /* 画面正中提示：type 取 ok（下载成功）/ err（下载失败） */
  function showTip(type, msg) {
    tipIco.textContent = type === 'ok' ? '✓' : '✕';
    tipTxt.textContent = msg;
    tip.className = 'tip on ' + type;
    clearTimeout(tip._h);
    tip._h = setTimeout(function () { tip.className = 'tip ' + type; }, 3000);
  }

  /* 评审控制：切换下载成功页 / 下载失败页 */
  var segs = document.querySelectorAll('#seg button');
  for (var i = 0; i < segs.length; i++) {
    segs[i].addEventListener('click', function () {
      for (var j = 0; j < segs.length; j++) { segs[j].classList.remove('on'); }
      this.classList.add('on');
      scene = this.getAttribute('data-scene');
      if (scene === 'fail') { showTip('err', '下载失败，请稍后重试'); }
      else { showTip('ok', '下载成功'); }
    });
  }

  /* 点击下载：按钮 loading → 结束按当前场景给出居中反馈 */
  dl.addEventListener('click', function () {
    dl.disabled = true;
    dl.textContent = '下载中…';
    setTimeout(function () {
      dl.disabled = false;
      dl.textContent = '下载合同';
      if (scene === 'fail') { showTip('err', '下载失败，请稍后重试'); }
      else { showTip('ok', '下载成功'); }
    }, 1000);
  });

  document.getElementById('know').addEventListener('click', function () {
    showTip('ok', '已关闭');
  });
</script>
</body>
</html>
