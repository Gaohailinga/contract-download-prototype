<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>签署完成页 · PC 端（纯净版）</title>
  <link rel="stylesheet" href="css/style-original.css" />
</head>
<body>
  <div class="stage">
    <div class="browser">
      <div class="browser-bar">
        <span class="browser-dot dot-red"></span>
        <span class="browser-dot dot-yellow"></span>
        <span class="browser-dot dot-green"></span>
        <div class="browser-url">https://xxx.tianque.com/sign/result</div>
      </div>

      <!-- 签署完成页 -->
      <div class="browser-body screen pc-result" id="screen-result">
        <div class="result-icon">✓</div>
        <h2 class="result-title">签署完成</h2>
        <p class="result-desc">你已成功完成电子签署，合同文件已生成</p>

        <div class="pc-btns">
          <button class="btn btn-primary" id="btn-download" type="button">下载合同</button>
        </div>
      </div>

      <!-- 首页占位（用于形成闭环） -->
      <div class="browser-body screen hidden" id="screen-home">
        <h3 class="home-title">我的合同</h3>
        <div class="home-item" id="home-contract">
          <span>已签署合同</span><span class="tag">查看 ›</span>
        </div>
        <div class="home-item"><span>待签署合同</span><span class="tag">0 份</span></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="js/app-original.js"></script>
</body>
</html>
